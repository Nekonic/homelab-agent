# Nova policy override for the AI-agent role (Kolla: /etc/kolla/config/nova/policy.yaml)
# Nova 33.x (OpenStack 2026.1). Defaults taken from
#   docker exec nova_api oslopolicy-sample-generator --namespace nova --output-file /tmp/s.yaml
# Pattern: "<upstream default> and not role:lab-agent"
#   -> admin/member behaviour is unchanged; any token carrying role lab-agent is refused.
# Only rules listed here are overridden; everything else keeps the in-code default.

# Any admin-gated API (evacuate, hosts, hypervisors, reset_state, flavor-manage, quotas update,
# all_tenants listing, forced_host ...) also refuses tokens with role lab-agent.
"context_is_admin": "role:admin and not role:lab-agent"

# --- destructive / image-producing server actions ---
"os_compute_api:servers:delete": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-deferred-delete:force": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:rebuild": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:rebuild:trusted_certs": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:create_image": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:create_image:allow_volume_backed": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-create-backup": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-shelve:shelve": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-shelve:unshelve": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:trigger_crash_dump": "rule:project_member_or_admin and not role:lab-agent"

# --- resize ---
"os_compute_api:servers:resize": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:confirm_resize": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:servers:revert_resize": "rule:project_member_or_admin and not role:lab-agent"

# --- lock / unlock ---
"os_compute_api:os-lock-server:lock": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-lock-server:unlock": "rule:project_member_or_admin and not role:lab-agent"

# --- migration / evacuation ---
"os_compute_api:os-migrate-server:migrate": "rule:project_manager_or_admin and not role:lab-agent"
"os_compute_api:os-migrate-server:migrate_live": "rule:project_manager_or_admin and not role:lab-agent"
"os_compute_api:servers:migrations:force_complete": "rule:project_manager_or_admin and not role:lab-agent"
"os_compute_api:servers:migrations:delete": "rule:project_manager_or_admin and not role:lab-agent"
"os_compute_api:os-evacuate": "rule:context_is_admin and not role:lab-agent"

# --- rescue ---
"os_compute_api:os-rescue": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-unrescue": "rule:project_member_or_admin and not role:lab-agent"

# --- admin actions (explicit, in addition to context_is_admin above) ---
"os_compute_api:os-admin-actions:reset_state": "rule:context_is_admin and not role:lab-agent"
"os_compute_api:os-admin-actions:inject_network_info": "rule:context_is_admin and not role:lab-agent"

# --- detach/delete of attached resources ---
"os_compute_api:os-attach-interfaces:delete": "rule:project_member_or_admin and not role:lab-agent"
"os_compute_api:os-volumes-attachments:delete": "rule:project_member_or_admin and not role:lab-agent"
